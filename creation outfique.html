<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Outfique - Creation</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;700&display=swap" rel="stylesheet" />
		<style>
			:root {
				--bg-left: #2b0f0f;
				--bg-mid: #8a5c1e;
				--bg-right: #f5df86;
				--accent: #f3e41b;
				--accent-dark: #cbbd00;
				--ink: #111;
				--ink-soft: rgba(0, 0, 0, 0.65);
				--card-shadow: rgba(0, 0, 0, 0.35);
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			html,
			body {
				height: 100%;
			}

			body {
				font-family: "Montserrat", sans-serif;
				background: linear-gradient(120deg, var(--bg-left) 0%, var(--bg-mid) 45%, var(--bg-right) 100%);
				color: #fff;
			}

			.page {
				max-width: 1200px;
				margin: 0 auto;
				padding: 24px 32px 48px;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				gap: 16px;
			}

			.top-bar {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 16px;
			}

			.brand {
				display: flex;
				align-items: center;
				gap: 12px;
			}

			.brand-mark {
				width: 56px;
				height: 56px;
				border-radius: 50%;
				background: radial-gradient(circle at 30% 30%, #ffd4c7, #ff9f7a 55%, #b14f3a 100%);
				position: relative;
				box-shadow: 0 6px 12px rgba(0, 0, 0, 0.35);
			}

			.brand-mark::before,
			.brand-mark::after {
				content: "";
				position: absolute;
				inset: 10px;
				border: 2px solid rgba(255, 255, 255, 0.6);
				border-radius: 50%;
			}

			.brand-text {
				font-size: 20px;
				font-weight: 700;
				font-style: italic;
				color: #ff9f7a;
				text-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
			}

			nav ul {
				list-style: none;
				display: flex;
				gap: 18px;
				align-items: center;
			}

			nav a {
				text-decoration: none;
				color: #1b1b1b;
				font-weight: 700;
				letter-spacing: 0.5px;
				text-transform: uppercase;
				background: #fff;
				padding: 6px 12px;
				border-radius: 20px;
				box-shadow: 0 6px 10px rgba(0, 0, 0, 0.18);
				transition: transform 0.2s ease, box-shadow 0.2s ease;
			}

			nav a:hover {
				transform: translateY(-2px);
				box-shadow: 0 10px 14px rgba(0, 0, 0, 0.22);
			}

			.main {
				flex: 1;
				display: grid;
				grid-template-columns: 1.1fr 0.9fr;
				gap: 32px;
				align-items: center;
			}

			.left-panel {
				display: flex;
				flex-direction: column;
				gap: 18px;
			}

			.camera-frame {
				height: 250px;
				border-radius: 28px;
				border: 3px solid rgba(0, 0, 0, 0.7);
				background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(0, 0, 0, 0.35));
				box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.45);
				position: relative;
				overflow: hidden;
			}

			.camera-frame video,
			.camera-frame canvas,
			.camera-frame img {
				width: 100%;
				height: 100%;
				object-fit: cover;
				display: block;
			}

			.camera-overlay {
				position: absolute;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				font-weight: 700;
				color: rgba(255, 255, 255, 0.75);
				text-transform: uppercase;
				letter-spacing: 1px;
				background: radial-gradient(circle at 40% 20%, rgba(255, 255, 255, 0.22), transparent 45%);
				pointer-events: none;
			}

			.button-row {
				display: flex;
				gap: 16px;
				align-items: center;
				flex-wrap: wrap;
			}

			.btn {
				background: var(--accent);
				color: var(--ink);
				border: 2px solid #1b1b1b;
				padding: 10px 18px;
				font-family: "Anton", sans-serif;
				font-size: 18px;
				letter-spacing: 0.8px;
				text-transform: uppercase;
				border-radius: 28px;
				box-shadow: 0 4px 0 var(--accent-dark);
				cursor: pointer;
				transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.2s ease;
			}

			.btn:active {
				transform: translateY(3px);
				box-shadow: 0 1px 0 var(--accent-dark);
			}

			.btn.small {
				font-size: 14px;
				padding: 8px 14px;
			}

			.btn.wide {
				min-width: 240px;
			}

			.status {
				font-size: 14px;
				color: rgba(255, 255, 255, 0.7);
			}

			.right-panel {
				display: grid;
				grid-template-columns: 1fr;
				gap: 20px;
				align-items: center;
				justify-items: center;
			}

			.outfit-panel {
				width: 100%;
				max-width: 380px;
				background: rgba(255, 255, 255, 0.25);
				border-radius: 26px;
				padding: 24px 18px;
				box-shadow: 0 20px 30px rgba(0, 0, 0, 0.25);
				display: grid;
				gap: 18px;
			}

			.outfit-item {
				display: grid;
				grid-template-columns: 40px 1fr 40px;
				align-items: center;
				gap: 12px;
			}

			.outfit-image {
				width: 100%;
				max-height: 140px;
				object-fit: contain;
				border-radius: 18px;
				padding: 6px;
				background: rgba(255, 255, 255, 0.6);
			}

			.arrow-btn {
				width: 40px;
				height: 40px;
				border-radius: 50%;
				border: 2px solid var(--ink);
				background: #fff;
				cursor: pointer;
				display: grid;
				place-items: center;
				transition: transform 0.2s ease, box-shadow 0.2s ease;
				box-shadow: 0 6px 10px rgba(0, 0, 0, 0.18);
			}

			.arrow-btn:hover {
				transform: rotate(-8deg) scale(1.05);
				box-shadow: 0 10px 16px rgba(0, 0, 0, 0.25);
			}

			.arrow-btn svg {
				width: 18px;
				height: 18px;
			}

			.spin {
				animation: spin 1.4s ease-in-out infinite;
			}

			@keyframes spin {
				0% {
					transform: rotate(0deg) scale(1);
				}
				50% {
					transform: rotate(10deg) scale(1.05);
				}
				100% {
					transform: rotate(0deg) scale(1);
				}
			}

			.glow {
				animation: glow 1.6s ease-in-out infinite;
			}

			@keyframes glow {
				0% {
					box-shadow: 0 0 0 rgba(243, 228, 27, 0.2);
				}
				50% {
					box-shadow: 0 0 20px rgba(243, 228, 27, 0.8);
				}
				100% {
					box-shadow: 0 0 0 rgba(243, 228, 27, 0.2);
				}
			}

			.actions {
				display: flex;
				flex-wrap: wrap;
				gap: 12px;
				justify-content: center;
			}

			@media (max-width: 960px) {
				.main {
					grid-template-columns: 1fr;
				}

				nav ul {
					flex-wrap: wrap;
					justify-content: flex-end;
				}
			}
		</style>
	</head>
	<body>
		<div class="page">
			<header class="top-bar">
				<div class="brand">
					<div class="brand-mark"></div>
					<div class="brand-text">Outfique</div>
				</div>
				<nav>
					<ul>
						<li><a href="#about">About</a></li>
                        <a href="1st outfique.html">Home</a>
                        <a href="team.html">Team</a>
						<li><a href="collections ko beh.html">Categories</a></li>
						<li><a href="faq.html">FAQ</a></li>
					</ul>
				</nav>
			</header>

			<div class="main">
				<section class="left-panel">
					<div class="camera-frame" id="cameraFrame">
						<video id="cameraVideo" autoplay playsinline muted></video>
						<canvas id="cameraCanvas" hidden></canvas>
						<div class="camera-overlay" id="cameraOverlay">Ready to style</div>
					</div>
					<div class="button-row">
						<button class="btn" id="openCameraBtn">Open Camera</button>
						<button class="btn small" id="takePhotoBtn">Take Photo &amp; Analyze</button>
					</div>
					<button class="btn wide" id="generateBtn">Generate Outfit</button>
					<button class="btn wide" id="customizeBtn">Cuztomize Outfit</button>
					<div class="status" id="statusText">Awaiting selection...</div>
				</section>

				<section class="right-panel">
					<div class="outfit-panel" id="outfitPanel">
						<div class="outfit-item">
							<button class="arrow-btn" id="topPrev" aria-label="Previous top">
								<svg viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
									<path d="M15 18l-6-6 6-6" />
								</svg>
							</button>
							<img class="outfit-image" id="topImage" alt="Top selection" />
							<button class="arrow-btn" id="topNext" aria-label="Next top">
								<svg viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
									<path d="M9 18l6-6-6-6" />
								</svg>
							</button>
						</div>
						<div class="outfit-item">
							<button class="arrow-btn" id="bottomPrev" aria-label="Previous bottom">
								<svg viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
									<path d="M15 18l-6-6 6-6" />
								</svg>
							</button>
							<img class="outfit-image" id="bottomImage" alt="Bottom selection" />
							<button class="arrow-btn" id="bottomNext" aria-label="Next bottom">
								<svg viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
									<path d="M9 18l6-6-6-6" />
								</svg>
							</button>
						</div>
					</div>
					<div class="actions">
						<button class="btn small" id="copyLinkBtn">Copy Design Link</button>
						<button class="btn small" id="saveBtn">Save Outfit</button>
						<button class="btn small" id="shareBtn">Share</button>
					</div>
				</section>
			</div>
		</div>

		<script>
			const statusText = document.getElementById("statusText");
			const cameraVideo = document.getElementById("cameraVideo");
			const cameraCanvas = document.getElementById("cameraCanvas");
			const cameraOverlay = document.getElementById("cameraOverlay");

			const openCameraBtn = document.getElementById("openCameraBtn");
			const takePhotoBtn = document.getElementById("takePhotoBtn");
			const generateBtn = document.getElementById("generateBtn");
			const customizeBtn = document.getElementById("customizeBtn");
			const copyLinkBtn = document.getElementById("copyLinkBtn");
			const saveBtn = document.getElementById("saveBtn");
			const shareBtn = document.getElementById("shareBtn");

			const topImage = document.getElementById("topImage");
			const bottomImage = document.getElementById("bottomImage");
			const topPrev = document.getElementById("topPrev");
			const topNext = document.getElementById("topNext");
			const bottomPrev = document.getElementById("bottomPrev");
			const bottomNext = document.getElementById("bottomNext");

			const outfitPanel = document.getElementById("outfitPanel");

			const tops = [
				"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=contain&w=600&q=80",
				"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=contain&w=600&q=80",
				"https://images.unsplash.com/photo-1512436991641-6745cdb1723f?auto=format&fit=contain&w=600&q=80",
			];
			const bottoms = [
				"https://images.unsplash.com/photo-1528701800489-20be1c0c7d39?auto=format&fit=contain&w=600&q=80",
				"https://images.unsplash.com/photo-1485968579580-b6d095142e6e?auto=format&fit=contain&w=600&q=80",
				"https://images.unsplash.com/photo-1503341455253-b2e723bb3dbb?auto=format&fit=contain&w=600&q=80",
			];

			let topIndex = 0;
			let bottomIndex = 0;
			let stream;
			let spinInterval;

			const category = new URLSearchParams(window.location.search).get("category");
			if (category) {
				statusText.textContent = `Category: ${category}`;
			}

			const renderOutfit = () => {
				topImage.src = tops[topIndex];
				bottomImage.src = bottoms[bottomIndex];
			};

			const shuffleOutfit = () => {
				topIndex = Math.floor(Math.random() * tops.length);
				bottomIndex = Math.floor(Math.random() * bottoms.length);
				renderOutfit();
				outfitPanel.classList.add("glow");
				setTimeout(() => outfitPanel.classList.remove("glow"), 1200);
			};

			const startSpin = () => {
				if (spinInterval) return;
				outfitPanel.classList.add("spin");
				spinInterval = setInterval(shuffleOutfit, 1200);
				statusText.textContent = "Spinning outfit...";
			};

			const stopSpin = () => {
				clearInterval(spinInterval);
				spinInterval = null;
				outfitPanel.classList.remove("spin");
				statusText.textContent = "Spin stopped";
			};

			const updateCameraOverlay = (message) => {
				cameraOverlay.textContent = message;
			};

			openCameraBtn.addEventListener("click", async () => {
				try {
					stream = await navigator.mediaDevices.getUserMedia({ video: true });
					cameraVideo.srcObject = stream;
					cameraVideo.hidden = false;
					cameraCanvas.hidden = true;
					updateCameraOverlay("Camera ready");
					statusText.textContent = "Camera opened";
				} catch (error) {
					statusText.textContent = "Camera access denied";
					updateCameraOverlay("Camera unavailable");
				}
			});

			takePhotoBtn.addEventListener("click", () => {
				if (!stream) {
					statusText.textContent = "Open camera first";
					return;
				}
				const context = cameraCanvas.getContext("2d");
				cameraCanvas.width = cameraVideo.videoWidth;
				cameraCanvas.height = cameraVideo.videoHeight;
				context.drawImage(cameraVideo, 0, 0, cameraCanvas.width, cameraCanvas.height);
				cameraCanvas.hidden = false;
				cameraVideo.hidden = true;
				updateCameraOverlay("Analyzing...\nLook your best");
				statusText.textContent = "Photo captured and analyzed";
			});

			generateBtn.addEventListener("click", () => {
				shuffleOutfit();
				statusText.textContent = "Generated a fresh outfit";
			});

			customizeBtn.addEventListener("click", () => {
				startSpin();
				setTimeout(stopSpin, 4200);
			});

			topPrev.addEventListener("click", () => {
				topIndex = (topIndex - 1 + tops.length) % tops.length;
				renderOutfit();
			});

			topNext.addEventListener("click", () => {
				topIndex = (topIndex + 1) % tops.length;
				renderOutfit();
			});

			bottomPrev.addEventListener("click", () => {
				bottomIndex = (bottomIndex - 1 + bottoms.length) % bottoms.length;
				renderOutfit();
			});

			bottomNext.addEventListener("click", () => {
				bottomIndex = (bottomIndex + 1) % bottoms.length;
				renderOutfit();
			});

			copyLinkBtn.addEventListener("click", async () => {
				const url = new URL(window.location.href);
				url.searchParams.set("top", topIndex);
				url.searchParams.set("bottom", bottomIndex);
				await navigator.clipboard.writeText(url.toString());
				statusText.textContent = "Design link copied";
			});

			saveBtn.addEventListener("click", () => {
				const outfit = { topIndex, bottomIndex, savedAt: new Date().toISOString() };
				localStorage.setItem("outfique-outfit", JSON.stringify(outfit));
				statusText.textContent = "Outfit saved locally";
			});

			shareBtn.addEventListener("click", async () => {
				const shareData = {
					title: "Outfique Outfit",
					text: "Check out my outfit!",
					url: window.location.href,
				};
				if (navigator.share) {
					await navigator.share(shareData);
				} else {
					await navigator.clipboard.writeText(window.location.href);
					statusText.textContent = "Link copied for sharing";
				}
			});

			const applySelectionFromUrl = () => {
				const params = new URLSearchParams(window.location.search);
				const topParam = parseInt(params.get("top"), 10);
				const bottomParam = parseInt(params.get("bottom"), 10);
				if (!Number.isNaN(topParam)) topIndex = Math.max(0, Math.min(tops.length - 1, topParam));
				if (!Number.isNaN(bottomParam)) bottomIndex = Math.max(0, Math.min(bottoms.length - 1, bottomParam));
				renderOutfit();
			};

			applySelectionFromUrl();
		</script>
	</body>
</html>
