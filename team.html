<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outfique Team</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #3b1d0f, #f5d98a);
      color: #fff;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 40px 20px;
      text-align: center;
    }

    .logo {
      text-align: left;
      margin-bottom: 20px;
      width: 120px;
      height: auto;
      display: block;
      border-radius: 16px;
      background: #fff;
      padding: 6px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .nav {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 26px;
      flex-wrap: wrap;
    }

    .nav a {
      text-decoration: none;
      color: #1b1b1b;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: #fff;
      padding: 8px 18px;
      border-radius: 999px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .nav a:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 16px rgba(0, 0, 0, 0.28);
    }

    h1 {
      font-size: 48px;
      margin: 20px 0 50px;
      letter-spacing: 4px;
      background: linear-gradient(to right, #ffd1a4, #ff9a9e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 40px;
    }

    .member {
      text-align: center;
    }

    .photo {
      width: 180px;
      height: 180px;
      margin: auto;
      border-radius: 20px;
      overflow: hidden;
      background: #fff;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .name {
      margin-top: 15px;
      font-weight: bold;
      font-size: 16px;
      letter-spacing: 1px;
    }

    footer {
      margin-top: 60px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="DESIGN NI JARED.png" alt="Outfique logo" />

    <nav class="nav" aria-label="Primary">
      <a href="about outfique.html">About</a>
      <a href="1st outfique.html">Home</a>
      <a href="team.html">Team</a>
      <a href="collections ko beh.html">Categories</a>
    </nav>

      </div>

      <div class="member">

      </div>

      <div class="member">

      </div>

      <div class="member">
        <div class="photo"><img src="image (1).png" alt="Dalupan" /></div>
        <div class="name">DALUPAN, LA REESE FRANZ K.</div>
      </div>

      <div class="member">
        <div class="photo"><img src="altha.jpg" alt="Arcilla" /></div>

      </div>

      <div class="member">

      </div>

      <div class="member">

      <div class="member">

    <footer>
      © 2026 Outfique. All rights reserved.

  </div>
</body>
</html>
