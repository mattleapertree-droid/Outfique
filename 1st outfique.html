<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Outfique — Welcome</title>
		<link rel="stylesheet" href="outflique beh.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Great+Vibes&family=Inter:wght@300;400;600&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				--bg-grad: linear-gradient(
					120deg,
					var(--outflique-teal, #5cc1b6) 0%,
					var(--outflique-mint, #a8c9b6) 30%,
					var(--outflique-cream, #f1e3b6) 55%,
					var(--outflique-peach, #f9a6a1) 75%,
					var(--outflique-pink, #f75088) 100%
				);
				--glass: rgba(255, 255, 255, 0.2);
				--shadow: rgba(24, 18, 14, 0.25);
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				height: 100%;
				margin: 0;
				font-family: "Inter", system-ui, sans-serif;
				color: var(--outflique-ink, #2a2624);
			}

			body {
				background: var(--bg-grad);
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 32px;
			}

			.stage {
				width: min(1100px, 100%);
				min-height: 640px;
				background: rgba(255, 255, 255, 0.6);
				border-radius: 32px;
				box-shadow: 0 24px 60px var(--shadow);
				backdrop-filter: blur(16px);
				padding: clamp(24px, 4vw, 44px);
				display: grid;
				grid-template-columns: minmax(300px, 1.05fr) minmax(280px, 1fr);
				gap: 36px;
				position: relative;
				overflow: hidden;
			}

			.stage::before {
				content: "";
				position: absolute;
				inset: 0;
				background: radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.55), transparent 55%);
				pointer-events: none;
			}

			.hero-left {
				display: flex;
				flex-direction: column;
				gap: 18px;
				z-index: 1;
			}

			.logo-row {
				display: flex;
				align-items: center;
				gap: 18px;
			}

			.logo {
				width: 120px;
				height: auto;
				border-radius: 18px;
				box-shadow: 0 14px 28px var(--shadow);
				background: #fff;
				padding: 8px;
			}

			.welcome {
				font-family: "Playfair Display", serif;
				font-size: clamp(28px, 4vw, 52px);
				letter-spacing: 6px;
				text-transform: uppercase;
				color: rgba(42, 38, 36, 0.7);
			}

			.brand {
				font-family: "Great Vibes", cursive;
				font-size: clamp(36px, 5vw, 68px);
				color: var(--outflique-pink, #f75088);
				line-height: 1;
			}

			.subtitle {
				font-family: "Playfair Display", serif;
				font-size: clamp(16px, 2vw, 22px);
				letter-spacing: 2px;
				text-transform: uppercase;
				color: rgba(42, 38, 36, 0.7);
			}

			.tagline {
				font-family: "Playfair Display", serif;
				font-size: clamp(24px, 3.5vw, 42px);
				color: var(--outflique-peach, #f9a6a1);
			}

			.cta {
				display: inline-flex;
				align-items: center;
				gap: 10px;
				padding: 12px 28px;
				border-radius: 999px;
				background: var(--glass);
				border: 1px solid rgba(255, 255, 255, 0.5);
				color: var(--outflique-ink, #2a2624);
				text-decoration: none;
				font-weight: 600;
				width: fit-content;
				box-shadow: 0 10px 20px var(--shadow);
			}

			.cta-group {
				display: flex;
				flex-wrap: wrap;
				gap: 12px;
			}

			.site-link {
				margin-top: 18px;
				padding: 14px 18px;
				border-radius: 20px;
				background: rgba(255, 255, 255, 0.55);
				box-shadow: 0 14px 26px var(--shadow);
				display: grid;
				gap: 10px;
				width: fit-content;
			}

			.site-label {
				text-transform: uppercase;
				letter-spacing: 2px;
				font-size: 12px;
				color: rgba(42, 38, 36, 0.65);
			}

			.site-url {
				font-weight: 600;
				color: var(--outflique-ink, #2a2624);
				text-decoration: none;
				word-break: break-all;
			}

			.site-url:hover {
				text-decoration: underline;
			}

			.sr-only {
				position: absolute;
				width: 1px;
				height: 1px;
				padding: 0;
				margin: -1px;
				overflow: hidden;
				clip: rect(0, 0, 0, 0);
				white-space: nowrap;
				border: 0;
			}

			.gallery {
				display: grid;
				grid-template-columns: repeat(2, minmax(120px, 1fr));
				grid-auto-rows: 170px;
				gap: 18px;
				z-index: 1;
			}

			.card {
				border-radius: 22px;
				overflow: hidden;
				box-shadow: 0 16px 28px var(--shadow);
				position: relative;
			}

			.card img {
				width: 100%;
				height: 100%;
				object-fit: cover;
				display: block;
			}

			.card.tall {
				grid-row: span 2;
			}

			.chip {
				position: absolute;
				bottom: 12px;
				left: 12px;
				background: rgba(0, 0, 0, 0.45);
				color: #fff7ef;
				padding: 6px 12px;
				border-radius: 999px;
				font-size: 12px;
				letter-spacing: 1px;
				text-transform: uppercase;
			}

			@media (max-width: 900px) {
				.stage {
					grid-template-columns: 1fr;
				}

				.gallery {
					grid-template-columns: repeat(2, minmax(120px, 1fr));
				}
			}
		</style>
	</head>
	<body>
		<main class="stage">
			<section class="hero-left">
				<div class="welcome">Welcome to</div>
				<div class="logo-row">
					<img class="logo" src="DESIGN NI JARED.png" alt="Outfique logo" />
					<div>
						<div class="brand">Outfique</div>
						<div class="subtitle">Style Studio</div>
					</div>
				</div>
				<div class="tagline">explore!</div>
				<div class="cta-group">
					<a class="cta" href="collections ko beh.html">Discover the collection →</a>
					<a class="cta" href="creation outfique.html">Go to creation →</a>
					<a class="cta" href="team.html">Meet the team →</a>
				</div>
				<div class="site-link" aria-live="polite">
					<div class="site-label">Website link</div>
					<a class="site-url" id="siteUrl" href="" aria-disabled="true" tabindex="-1">Website link loading...</a>
					<button class="cta" type="button" id="copySiteLink" aria-describedby="copyStatus">Copy link</button>
					<span class="sr-only" id="copyStatus" aria-live="polite"></span>
				</div>
			</section>

			<section class="gallery" id="gallery" aria-label="Outfique gallery">
				<div class="card tall">
					<img
						src="https://images.unsplash.com/photo-1503341455253-b2e723bb3dbb?auto=format&fit=crop&w=600&q=80"
						alt="Model in a flowing dress"
					/>
					<span class="chip">Editorial</span>
				</div>
				<div class="card">
					<img
						src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=600&q=80"
						alt="Street style portrait"
					/>
					<span class="chip">Urban</span>
				</div>
				<div class="card">
					<img
						src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=600&q=80"
						alt="Casual menswear"
					/>
					<span class="chip">Essentials</span>
				</div>
				<div class="card">
					<img
						src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=600&q=80"
						alt="Bold fashion portrait"
					/>
					<span class="chip">Glow</span>
				</div>
			</section>
		</main>
		<script>
			const siteUrl = document.getElementById("siteUrl");
			const copySiteLink = document.getElementById("copySiteLink");
			const copyStatus = document.getElementById("copyStatus");
			const resolvedLink = window.location.href;
			const successResetDelay = 2000; // Keep the success message brief so the UI resets quickly.
			const errorResetDelay = 2500; // Slightly longer to give users time to read the guidance.
			const isLocalhost = ["localhost", "127.0.0.1"].includes(window.location.hostname);
			const canUseClipboard = Boolean(navigator.clipboard && (window.isSecureContext || isLocalhost));

			siteUrl.textContent = resolvedLink;
			siteUrl.setAttribute("href", resolvedLink);
			siteUrl.removeAttribute("aria-disabled");
			siteUrl.removeAttribute("tabindex");

			copySiteLink.addEventListener("click", async () => {
				if (!canUseClipboard) {
					copySiteLink.textContent = "Copy unavailable";
					copyStatus.textContent = "Copy unavailable. Please select the link above and copy it manually.";
					setTimeout(() => {
						copySiteLink.textContent = "Copy link";
						copyStatus.textContent = "";
					}, errorResetDelay);
					siteUrl.focus();
					return;
				}
				try {
					await navigator.clipboard.writeText(resolvedLink);
					copySiteLink.textContent = "Link copied!";
					copyStatus.textContent = "Link copied to clipboard.";
					setTimeout(() => {
						copySiteLink.textContent = "Copy link";
						copyStatus.textContent = "";
					}, successResetDelay);
				} catch (error) {
					copySiteLink.textContent = "Copy failed";
					copyStatus.textContent = "Copy failed. Please select the link above and copy it manually.";
					setTimeout(() => {
						copySiteLink.textContent = "Copy link";
						copyStatus.textContent = "";
					}, errorResetDelay);
					siteUrl.focus();
				}
			});
		</script>
	</body>
</html>
